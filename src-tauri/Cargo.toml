[package]
name = "quickdeck"
version = "0.1.1"
description = "QuickDeck - 화면형 컨트롤 덱"
authors = ["lohemal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "quickdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
winreg = "0.55"
uuid = { version = "1", features = ["v4"] }
# 아이콘: 사용자 이미지 검증·축소·PNG 정규화, 셸 아이콘 비트맵 → PNG. 필요한 디코더만 켠다
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
